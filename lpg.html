<style>
*{box-sizing:border-box}
:root{--red:#b80018;--red2:#e00020;--ink:#162033;--muted:#667085;--bg:#f5f7fa;--line:#e6e9ef;--white:#fff;--nav:#101827}

main{margin-left:255px;min-height:100vh}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;cursor:pointer;box-shadow:0 5px 18px #1018280a;transition:.15s}

.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.icon{width:42px;height:42px;border-radius:12px;background:#fff0f2;color:var(--red);display:grid;place-items:center;font-size:20px}.label{color:var(--muted);font-size:13px}.value{font-size:26px;font-weight:800;margin:9px 0 2px}.mini{font-size:12px;color:#98a2b3}
.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #10182808}.panel h3{margin:0 0 13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.tools button{background:#eef1f5;color:#344054}.tools .primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#f8fafc;color:#475467;position:sticky;top:0}

@media(max-width:800px){
 aside{transform:translateX(-105%);transition:.2s;width:280px}
 aside.open{transform:translateX(0)}

/* ===== STATUS LOKASI PRO ===== */
.status-pill{

  justify-content:center;

  border-color:#86efac;
}
.status-pill.lebih{
  color:#075985;
  background:#e0f2fe;
  border-color:#7dd3fc;
}

</style>

function normKet(v){
 return String(v||"").trim().toLowerCase().replace(/\s+/g," ");
}
function ketIsiUlang(v){
 var k=normKet(v);
 return k==="isi ulang" || k.indexOf("isi ulang")===0;
}
function ketPenambahanAset(v){
 var k=normKet(v);
 return k==="penambahan aset" || k.indexOf("penambahan aset")===0;
}
function parseBiaya(v){
 var raw=String(v==null?"":v).trim();
 if(!raw)return 0;
 // Mendukung nilai numerik maupun format tampilan seperti "Rp 3.500.000".
 if(/^-?\d+(?:\.\d+)?$/.test(raw)) return Number(raw);
 var cleaned=raw.replace(/[^0-9,-]/g,"").replace(/\./g,"").replace(/,/g,".");
 var n=Number(cleaned);
 return isFinite(n)?n:0;
}
function sameLokasi(a,b){
 return normKet(a)===normKet(b);
}
window.dashboardDateKey=function(v){
 var raw=String(v==null?"":v).trim();
 if(!raw)return "";
 // Format input utama sistem: YYYY-MM-DD (termasuk ISO datetime).
 var iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(iso)return iso[1]+"-"+iso[2]+"-"+iso[3];
 // Kompatibilitas data lama: DD/MM/YYYY atau DD-MM-YYYY.
 var dmy=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
 if(dmy)return dmy[3]+"-"+String(dmy[2]).padStart(2,"0")+"-"+String(dmy[1]).padStart(2,"0");
 return "";
}
function biayaKeluarByKet(lokasi, matcher){
 return tubeFilterArr(data.keluar).filter(function(x){
   var d=dashboardDateKey(x&&x.tanggal);
   var inPeriod=(!monitoringFilter.dari||d>=monitoringFilter.dari)&&(!monitoringFilter.sampai||d<=monitoringFilter.sampai);
   return x && sameLokasi(x.lokasi,lokasi) && matcher(x.keterangan) && inPeriod;
 }).reduce(function(sum,x){
   return sum+parseBiaya(x.biaya)*Number(x.qty||0);
 },0);
}

var monitoringFilter={lokasi:"",dari:"",sampai:""};
var dashboardMonth=localStorage.getItem("ktu_lpg_dashboard_month_v1")||new Date().toISOString().slice(0,7);
function validDashboardMonth(v){return /^\d{4}-\d{2}$/.test(String(v||""));}
function dashboardMonthLabel(v){var p=String(v||dashboardMonth).split("-");var d=new Date(Number(p[0]),Number(p[1])-1,1);return d.toLocaleDateString("id-ID",{month:"long",year:"numeric"});}
function dashboardMonthBounds(v){var p=String(v||dashboardMonth).split("-");var y=Number(p[0]),m=Number(p[1])-1;var last=new Date(y,m+1,0);function pad(n){return String(n).padStart(2,"0");}return {start:y+"-"+pad(m+1)+"-01",end:y+"-"+pad(m+1)+"-"+pad(last.getDate())};}
function dashboardPeriodFilter(arr,start,end){return (arr||[]).filter(function(x){var d=dashboardDateKey(x&&x.tanggal);return d&&d>=start&&d<=end;});}
function dashboardUntil(arr,end){return (arr||[]).filter(function(x){var d=dashboardDateKey(x&&x.tanggal);return d&&d<=end;});}
function setDashboardMonth(v){if(!validDashboardMonth(v))return;dashboardMonth=v;localStorage.setItem("ktu_lpg_dashboard_month_v1",v);dashboard();}
window.dashboardPrevMonth=function(){var p=dashboardMonth.split("-");var d=new Date(Number(p[0]),Number(p[1])-2,1);setDashboardMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));};
window.dashboardNextMonth=function(){var p=dashboardMonth.split("-");var d=new Date(Number(p[0]),Number(p[1]),1);setDashboardMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));};
window.dashboardCurrentMonth=function(){setDashboardMonth(new Date().toISOString().slice(0,7));};
function inMonitoringPeriod(x){var d=String(x&&x.tanggal||"");if(!d)return false;if(monitoringFilter.dari&&d<monitoringFilter.dari)return false;if(monitoringFilter.sampai&&d>monitoringFilter.sampai)return false;return true;}
function arrMonitoring(arr,l){return tubeFilterArr(arr).filter(function(x){return sameLokasi(x.lokasi,l)&&inMonitoringPeriod(x);});}
function lokasiPeriodArr(arr,l){return tubeFilterArr(arr).filter(function(x){return sameLokasi(x.lokasi,l)&&(!monitoringFilter.sampai||String(x.tanggal||"")<=monitoringFilter.sampai);});}
function locStat(l){
 var keluarArr=arrMonitoring(data.keluar,l);
 var masukArr=arrMonitoring(data.kembali,l);
 var keluarSemua=total(keluarArr,"qty");
 var masukSemua=total(masukArr,"qty");

 // Otomatis berdasarkan KETERANGAN transaksi:
 // Tabung Masuk + "Minta Isi Ulang" => Hutang
 // Tabung Keluar + "Isi Ulang" => Isi Ulang
 // Tabung Keluar + "Penambahan Aset" => Penambahan Aset
 var mintaIsiUlang=masukArr.filter(function(x){
   return normKet(x.keterangan)==="minta isi ulang";
 }).reduce(function(s,x){return s+Number(x.qty||0)},0);

 var isiUlang=keluarArr.filter(function(x){
   return ketIsiUlang(x.keterangan);
 }).reduce(function(s,x){return s+Number(x.qty||0)},0);

 var aset=keluarArr.filter(function(x){
   return ketPenambahanAset(x.keterangan);
 }).reduce(function(s,x){return s+Number(x.qty||0)},0);

 // RUMUS SALING BERKAITAN:
 // 1) Stok Aset Lokasi = stok aset dasar/manual + Penambahan Aset.
 // 2) Stok Lokasi = Stok Aset Lokasi + tabung yang dikirim keluar - tabung yang masuk/kembali.
 //    Artinya, jika pengirim mengirim 1 tabung lebih dulu, stok lokasi naik 1 dan
 //    otomatis menjadi LEBIH 1. Jika lokasi kemudian mengirim kembali 2 tabung,
 //    stok lokasi turun 2 sehingga saldo berubah menjadi HUTANG 1.
 var stokAsetManual=Number(getTubeAdjustment(l)||0);
 // Stok Aset Lokasi bertambah hanya dari Penambahan Aset.
 var stokAsetDasar=stokAsetManual + aset;
 // Stok Lokasi dihitung dari stok aset manual + seluruh pergerakan tabung.
 // Penambahan Aset sudah termasuk di keluarSemua, jadi JANGAN ditambahkan dua kali.
 var stokLokasi=stokAsetManual + keluarSemua - masukSemua;

 // Hutang isi ulang tetap merupakan permintaan isi ulang yang belum terpenuhi.
 var hutangIsiUlang=Math.max(0,mintaIsiUlang-isiUlang);

 // Selisih utama terhadap aset lokasi:
 // positif = pengirim sudah mengirim lebih banyak dari aset lokasi;
 // negatif = posisi lokasi lebih rendah dari asetnya sehingga pengirim berhutang ke lokasi.
 var selisihAset=stokLokasi-stokAsetDasar;
 var lebih=Math.max(0,Math.round((stokLokasi-stokAsetDasar)*1000000)/1000000);
 var hutangLokasi=Math.max(0,Math.round((stokAsetDasar-stokLokasi)*1000000)/1000000);

 // Hutang yang ditampilkan pada monitoring adalah hutang ke lokasi berdasarkan saldo aset.
 // Hutang isi ulang tetap tersedia sebagai mintaIsiUlang/isiUlang untuk kebutuhan isi ulang.
 var hutang=hutangLokasi;

 return {
   keluar:keluarSemua,
   masuk:masukSemua,
   stokLokasi:stokLokasi,
   // Stok Aset Lokasi berasal dari transaksi Penambahan Aset + penyesuaian manual.
   // Tabung Keluar/Tabung Masuk/Isi Ulang tidak mengubah stok aset.
   stokAset:stokAsetDasar,
   isiUlang:isiUlang,
   hutang:hutang,
   hutangIsiUlang:hutangIsiUlang,
   selisihAset:selisihAset,
   lebih:lebih,
   aset:aset,
   mintaIsiUlang:mintaIsiUlang,
   // Biaya diambil langsung dari transaksi Tabung Keluar berdasarkan Keterangan.
   // "Isi Ulang" -> Biaya Isi Ulang
   // "Penambahan Aset" -> Biaya Penambahan Aset
   biaya:biayaKeluarByKet(l,ketIsiUlang),
   biayaAset:biayaKeluarByKet(l,ketPenambahanAset),
   biayaKeluar:data.keluar.filter(function(x){return sameLokasi(x.lokasi,l)}).reduce(function(s,x){return s+parseBiaya(x.biaya)},0)
 };
}

window.login=function(e){

  var u=(document.getElementById("u").value||"").trim();
  var p=document.getElementById("p").value||"";
  if(u==="admin" && p==="admin123"){
    document.getElementById("err").textContent="";

    function doShow(){
      document.getElementById("login").style.display="none";

      try{
        if(typeof buildNav==="function") buildNav();

        if(c)c.innerHTML='<div class="panel"><h3>Dashboard</h3><p class="muted">Login berhasil. Dashboard sedang dimuat ulang.</p></div>';
      }
    }
    fetch("api.php?action=direct_load",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:"admin"})
    }).then(function(r){return r.json();}).then(function(res){
      console.log("[KTU] direct_load response:",JSON.stringify(res).substring(0,300));
      if(res.ok && res.data){
        var d=res.data;
        // Overwrite jika server punya data apapun
        var sData=d.data;
        var hasData=sData && (
          (Array.isArray(sData.keluar) && sData.keluar.length>0) ||
          (Array.isArray(sData.kembali) && sData.kembali.length>0) ||
          (Array.isArray(sData.tabung) && sData.tabung.length>0) ||
          (Array.isArray(sData.refill) && sData.refill.length>0) ||
          (Array.isArray(sData.aset) && sData.aset.length>0) ||
          (Array.isArray(sData.opname) && sData.opname.length>0) ||
          (Array.isArray(sData.hutang) && sData.hutang.length>0) ||
          (sData.stokAsetAdjustment && Object.keys(sData.stokAsetAdjustment).length>0) ||
          (Array.isArray(d.masterLokasi) && d.masterLokasi.length>0)
        );
        if(hasData){
          if(sData && (!sData.stokAsetAdjustment || Array.isArray(sData.stokAsetAdjustment))){
            sData.stokAsetAdjustment={};
          }
          if(sData && !Array.isArray(sData.stokHarian)){
            sData.stokHarian=[];
          }
          data=sData;
          if(d.settings && Object.keys(d.settings).length) settings=d.settings;
          if(Array.isArray(d.masterLokasi) && d.masterLokasi.length) locations=d.masterLokasi;
          // Sinkronkan pointer global window agar plugin/komponen lain melihat data terbaru
          window.data=data;
          window.locations=locations;
          window.settings=settings;
          localStorage.setItem("ktu_lpg_data_v2",JSON.stringify(data));
          localStorage.setItem("ktu_lpg_settings_v2",JSON.stringify(settings));
          localStorage.setItem("ktu_lpg_master_lokasi_v1",JSON.stringify(locations));
        }
      }
    }).catch(function(e){console.warn("[KTU] Load server gagal:",e);}).finally(function(){
      doShow();
    });
  } else {
    document.getElementById("err").textContent="Username atau password salah.";
  }
}

window.syncFromServer=function(silent){
  var btn=document.getElementById("syncBtn");
  if(btn) btn.textContent="⏳ Sync...";
  fetch("api.php?action=direct_load",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:"admin"})
  }).then(function(r){return r.json();}).then(function(res){
    if(res.ok && res.data){
      var d=res.data;
      var sData=d.data;
      var hasData=sData && (
        (Array.isArray(sData.keluar) && sData.keluar.length>0) ||
        (Array.isArray(sData.kembali) && sData.kembali.length>0) ||
        (Array.isArray(sData.tabung) && sData.tabung.length>0) ||
        (Array.isArray(sData.refill) && sData.refill.length>0) ||
        (Array.isArray(sData.aset) && sData.aset.length>0) ||
        (Array.isArray(sData.opname) && sData.opname.length>0) ||
        (Array.isArray(sData.hutang) && sData.hutang.length>0) ||
        (sData.stokAsetAdjustment && Object.keys(sData.stokAsetAdjustment).length>0) ||
        (Array.isArray(d.masterLokasi) && d.masterLokasi.length>0)
      );
      if(hasData){
        if(sData && (!sData.stokAsetAdjustment || Array.isArray(sData.stokAsetAdjustment))){
          sData.stokAsetAdjustment={};
        }
        if(sData && !Array.isArray(sData.stokHarian)){
          sData.stokHarian=[];
        }
        data=sData;
        if(d.settings && Object.keys(d.settings).length) settings=d.settings;
        if(Array.isArray(d.masterLokasi) && d.masterLokasi.length) locations=d.masterLokasi;
        window.data=data;
        window.locations=locations;
        window.settings=settings;
        localStorage.setItem("ktu_lpg_data_v2",JSON.stringify(data));
        localStorage.setItem("ktu_lpg_settings_v2",JSON.stringify(settings));
        localStorage.setItem("ktu_lpg_master_lokasi_v1",JSON.stringify(locations));
        if(!silent) alert("Sinkronisasi berhasil! Data terbaru sudah dimuat.");
        if(typeof show==="function") show(window.currentPage||"dashboard");
      }else{
        if(!silent) alert("Server belum memiliki data.");
      }
    }
  }).catch(function(e){
    console.warn("[KTU] syncFromServer error:",e);
    if(!silent) alert("Gagal menghubungi server: "+(e.message||e));
  }).finally(function(){
    if(btn) btn.textContent="🔄 Sync";
  });
};

/* Sidebar V9: pastikan menu selalu menutup overlay dan hanya satu menu aktif. */
(function(){
  var menu=document.getElementById('menuBtn'), sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
  if(menu && sidebar && overlay){
    menu.setAttribute('aria-expanded','false');
    menu.onclick=function(e){
      if(e)e.preventDefault();
      var open=!sidebar.classList.contains('open');
      sidebar.classList.toggle('open',open);
      overlay.classList.toggle('show',open);
      menu.setAttribute('aria-expanded',String(open));
    };
    overlay.onclick=function(){
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
      menu.setAttribute('aria-expanded','false');
    };
    sidebar.addEventListener('click',function(e){
      var b=e.target.closest ? e.target.closest('button[data-page]') : null;
      if(!b)return;
      setTimeout(function(){
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
        menu.setAttribute('aria-expanded','false');
      },0);
    });
  }
})();

var activeTubeType=localStorage.getItem("KTU_ACTIVE_TUBE_TYPE")||"LPG 12 Kg";
var activePage=localStorage.getItem("KTU_ACTIVE_PAGE")||"dashboard";
var tubeTypes=(function(){
  var base=["LPG 12 Kg","LPG 3 Kg","LPG 5,5 Kg","LPG 50 Kg","Oxygen","Acetylene"];
  try{var a=JSON.parse(localStorage.getItem("KTU_MASTER_TUBE_TYPES")||"[]");if(Array.isArray(a))a.forEach(function(x){x=String(x||"").trim();if(x&&base.indexOf(x)<0)base.push(x);});}catch(e){}
  return base;
})();
function saveMasterTubeTypes(){localStorage.setItem("KTU_MASTER_TUBE_TYPES",JSON.stringify(tubeTypes));}
function tubeFilterArr(a){return (a||[]).filter(function(x){return (x.tubeType||"LPG 12 Kg")===activeTubeType;});}
function tubeAdjustmentKey(l){return activeTubeType+"||"+String(l||"");}
function getTubeAdjustment(l){
  var obj=data.stokAsetAdjustment||{};
  var key=tubeAdjustmentKey(l);
  if(Object.prototype.hasOwnProperty.call(obj,key)) return Number(obj[key]||0);
  if(activeTubeType==="LPG 12 Kg" && Object.prototype.hasOwnProperty.call(obj,l)) return Number(obj[l]||0);
  return 0;
}
function setTubeAdjustment(obj,l,v){obj[tubeAdjustmentKey(l)]=Number(v||0);}

function buildNav(){

function editMasterTabung(i){
 var old=tubeTypes[i]; if(!old)return;
 var n=window.prompt("Ubah nama jenis tabung:",old);
 if(n===null)return;
 n=String(n).trim();
 if(!n){window.alert("Nama jenis tabung wajib diisi.");return;}
 if(n.toLowerCase()!==old.toLowerCase() &&
    tubeTypes.some(function(x){return String(x).toLowerCase()===n.toLowerCase();})){
   window.alert("Nama jenis tabung sudah ada.");return;
 }
 ["keluar","kembali","refill","aset","tabung","opname"].forEach(function(k){
   (data[k]||[]).forEach(function(x){
     if(String(x&&x.tubeType||"LPG 12 Kg")===old)x.tubeType=n;
   });
 });
 (data.stokHarian||[]).forEach(function(rec){
   if(Array.isArray(rec.items)){
     rec.items.forEach(function(it){
       if(String(it&&it.tubeType||"")===old)it.tubeType=n;
     });
   }else if(String(rec&&rec.tubeType||"LPG 12 Kg")===old){
     rec.tubeType=n;
   }
 });
 if(activeTubeType===old){
   activeTubeType=n;
   localStorage.setItem("KTU_ACTIVE_TUBE_TYPE",n);
 }
 tubeTypes[i]=n;
 saveMasterTubeTypes();
 if(typeof saveAll==="function")saveAll();
 buildNav();
 masterTabung();
}

function hapusMasterTabung(i){
 var n=tubeTypes[i]; if(!n)return;
 if(tubeTypes.length<=1){window.alert("Minimal harus ada 1 jenis tabung.");return;}
 var used=false;
 ["keluar","kembali","refill","aset","tabung","opname"].forEach(function(k){
   (data[k]||[]).forEach(function(x){
     if(String(x&&x.tubeType||"LPG 12 Kg")===n)used=true;
   });
 });
 (data.stokHarian||[]).forEach(function(rec){if(stokHarianHasType(rec,n))used=true;});
 if(used){
   window.alert("Jenis tabung ini sudah memiliki data, jadi tidak bisa dihapus agar data lama tetap aman.");
   return;
 }
 if(!window.confirm('Hapus jenis tabung "'+n+'"?'))return;
 tubeTypes.splice(i,1);
 if(activeTubeType===n){
   activeTubeType=tubeTypes[0];
   localStorage.setItem("KTU_ACTIVE_TUBE_TYPE",activeTubeType);
 }
 saveMasterTubeTypes();
 buildNav();
 masterTabung();
}

 var maxVal=stats.reduce(function(m,x){return Math.max(m,Number(x.s.stokAset||0),Number(x.s.stokLokasi||0))},0)||1;
 var rows=stats.map(function(x){var aset=Number(x.s.stokAset||0),stok=Number(x.s.stokLokasi||0),asetW=aset>0?Math.max(2,(aset/maxVal)*100):0,stokW=stok>0?Math.max(2,(stok/maxVal)*100):0,pct=aset>0?(stok/aset)*100:0,pctText=aset>0?pct.toFixed(1)+'%':'-';return '<div class="stock-row"><div class="stock-location" title="'+esc(x.lokasi)+'">'+esc(x.lokasi)+'</div><div class="stock-bars"><div class="stock-track" title="Stok Aset Lokasi: '+aset+'"><div class="stock-fill aset" style="width:'+asetW+'%"></div></div><div class="stock-track" title="Stok Lokasi: '+stok+'"><div class="stock-fill lokasi" style="width:'+stokW+'%"></div></div></div><div class="stock-pct">'+pctText+'<small>'+stok+' / '+aset+'</small></div></div>';}).join('');

function dashboardLocStatMonthly(l,start,end){
  /* Dashboard: transaksi bulan aktif, tetapi STOK ASET LOKASI adalah saldo berjalan
     sampai akhir bulan aktif. Contoh: Juli 10, Agustus +1, September tanpa input = 11. */
  function inRange(x,a,b){
    var d=dashboardDateKey(x&&x.tanggal);
    return !!d && d>=a && d<=b;
  }
  function beforeOrAt(x,b){
    var d=dashboardDateKey(x&&x.tanggal);
    return !!d && d<=b;
  }
  function sameTypeAndLocation(x){
    var active=String(window.activeTubeType||localStorage.getItem('KTU_ACTIVE_TUBE_TYPE')||'LPG 12 Kg');
    return x && String(x.tubeType||'LPG 12 Kg')===active && sameLokasi(x.lokasi,l);
  }
  function monthArr(arr){return (arr||[]).filter(function(x){return sameTypeAndLocation(x)&&inRange(x,start,end);});}
  function historyArr(arr){return (arr||[]).filter(function(x){return sameTypeAndLocation(x)&&beforeOrAt(x,end);});}
  function q(a){return (a||[]).reduce(function(n,x){return n+Number(x&&x.qty||0);},0);}
  var keluar=monthArr(data.keluar), masuk=monthArr(data.kembali);
  var keluarHist=historyArr(data.keluar), masukHist=historyArr(data.kembali);
  var asetBulan=keluar.filter(function(x){return ketPenambahanAset(x.keterangan);});
  var isiBulan=keluar.filter(function(x){return ketIsiUlang(x.keterangan);});
  var mintaBulan=masuk.filter(function(x){return normKet(x.keterangan)==='minta isi ulang';});
  var asetHist=keluarHist.filter(function(x){return ketPenambahanAset(x.keterangan);});

  /* Penyesuaian/manual adalah stok awal yang tetap menjadi dasar. */
  var stokManual=Number(getTubeAdjustment(l)||0);
  var stokAset=stokManual+q(asetHist);

  /* Stok lokasi juga merupakan saldo berjalan sampai akhir bulan aktif. */
  var stokLokasi=stokManual+q(keluarHist)-q(masukHist);
  var selisih=stokLokasi-stokAset;

  var biayaIsi=isiBulan.reduce(function(n,x){return n+parseBiaya(x.biaya)*Number(x.qty||0);},0);
  var biayaAset=asetBulan.reduce(function(n,x){return n+parseBiaya(x.biaya)*Number(x.qty||0);},0);

  return {
    keluar:q(keluar),
    masuk:q(masuk),
    isiUlang:q(isiBulan),
    aset:q(asetBulan),
    mintaIsiUlang:q(mintaBulan),
    stokAset:stokAset,
    stokLokasi:stokLokasi,
    hutang:Math.max(0,-selisih),
    lebih:Math.max(0,selisih),
    biaya:biayaIsi,
    biayaAset:biayaAset,
    keluarRows:keluar,
    masukRows:masuk
  };
}

function stokMasterTypes(){
  return (tubeTypes||[]).filter(function(t){return String(t||"").trim()!=="";});
}
function stokItemMap(rec){
  var map={};
  stokMasterTypes().forEach(function(t){map[t]={tubeType:t,kosong:0,isi:0,total:0};});
  if(rec && Array.isArray(rec.items)){
    rec.items.forEach(function(it){
      var t=String(it&&it.tubeType||"").trim();
      if(!t)return;
      if(!map[t])map[t]={tubeType:t,kosong:0,isi:0,total:0};
      map[t].kosong=Math.max(0,Number(it.kosong||0));
      map[t].isi=Math.max(0,Number(it.isi||0));
      map[t].total=Math.max(0,Number(it.total!=null?it.total:(map[t].kosong+map[t].isi)));
    });
  }else if(rec){
    // Data lama: dianggap sebagai stok LPG 12 Kg.
    var legacy=map["LPG 12 Kg"]||(map["LPG 12 Kg"]={tubeType:"LPG 12 Kg",kosong:0,isi:0,total:0});
    legacy.kosong=Math.max(0,Number(rec.kosong||0));
    legacy.isi=Math.max(0,Number(rec.isi||0));
    legacy.total=Math.max(0,Number(rec.total!=null?rec.total:(legacy.kosong+legacy.isi)));
  }
  return map;
}
function stokItemsArray(rec){
  var map=stokItemMap(rec);
  return stokMasterTypes().map(function(t){return map[t]||{tubeType:t,kosong:0,isi:0,total:0};});
}
function stokSummary(rec){
  var items=stokItemsArray(rec);
  return items.reduce(function(s,it){
    s.kosong+=Number(it.kosong||0);
    s.isi+=Number(it.isi||0);
    s.total+=Number(it.total!=null?it.total:(Number(it.kosong||0)+Number(it.isi||0)));
    return s;
  },{kosong:0,isi:0,total:0});
}
function latestStokHarian(){
  return (data.stokHarian||[]).slice().sort(function(a,b){return String(b.tanggal||"").localeCompare(String(a.tanggal||""));})[0]||null;
}
function stokFormId(i,field){return "stok_"+field+"_"+i;}
function stokGetFormValues(rec){
  var map=stokItemMap(rec);
  return stokMasterTypes().map(function(t,i){
    var it=map[t]||{kosong:0,isi:0};
    return {tubeType:t,kosong:Number(it.kosong||0),isi:Number(it.isi||0)};
  });
}

    var a=document.getElementById(stokFormId(i,"kosong"));

function stokSaveFromForm(){
  var tanggal=document.getElementById("stokHariTanggal").value;
  if(!tanggal){alert("Tanggal wajib diisi.");return;}
  var items=stokMasterTypes().map(function(t,i){
    var kosong=Math.max(0,Number(document.getElementById(stokFormId(i,"kosong")).value||0));
    var isi=Math.max(0,Number(document.getElementById(stokFormId(i,"isi")).value||0));
    return {tubeType:t,kosong:kosong,isi:isi,total:kosong+isi};
  });
  var lpg12=items.find(function(x){return x.tubeType==="LPG 12 Kg";})||{kosong:0,isi:0,total:0};
  var rec={
    tanggal:tanggal,
    items:items,
    // Field lama tetap dipertahankan agar data lama/fitur lama tidak rusak.
    tubeType:"LPG 12 Kg",
    kosong:lpg12.kosong,
    isi:lpg12.isi,
    total:lpg12.total
  };
  var idx=data.stokHarian.findIndex(function(x){return String(x.tanggal||"")===tanggal;});
  if(idx>=0)data.stokHarian[idx]=rec;else data.stokHarian.push(rec);
  saveAll();
  tabung();
}

function getStokExportRange(){

  var filtered=(data.stokHarian||[]).slice().filter(function(x){

function exportStokHarian(){
  var r=getStokExportRange();if(!r)return;
  var types=stokMasterTypes();
  var header=['Tanggal'];
  types.forEach(function(t){header.push(t+' - Kosong');header.push(t+' - Isi');header.push(t+' - Total');});
  var rows=[header];
  r.rows.forEach(function(rec){
    var map=stokItemMap(rec),row=[rec.tanggal];
    types.forEach(function(t){
      var it=map[t]||{kosong:0,isi:0,total:0};
      row.push(Number(it.kosong||0),Number(it.isi||0),Number(it.total!=null?it.total:(Number(it.kosong||0)+Number(it.isi||0))));
    });
    rows.push(row);
  });
  if(rows.length===1){alert('Tidak ada data stok pada periode yang dipilih.');return;}
  var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',');}).join('\n');
  var label=(r.dari&&r.sampai)?('_'+r.dari+'_'+r.sampai):'_Semua_Tanggal';
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Laporan_Stok_Semua_Jenis_Gudang_RO'+label+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},500);
}

/* ===== FLEXIBLE REFILL COST PATCH =====
   Biaya isi ulang tidak lagi memakai satu tarif global.
   Setiap transaksi refill menyimpan biaya/tabung masing-masing.
*/
function refillCostStat(l){
  var arr=tubeFilterArr(data.refill).filter(function(x){return x.lokasi===l;});
  var qty=arr.reduce(function(s,x){return s+Number(x.qty||0)},0);
  var totalCost=arr.reduce(function(s,x){
    var q=Number(x.qty||0), c=Number(x.biaya||0);
    return s+(Number(x.total||0) || q*c);
  },0);
  return {qty:qty,total:totalCost,avg:qty?totalCost/qty:0,count:arr.length};
}

locStat = function(l){

  s.refillQty=r.qty;

};

/* ===== FINAL FORMULA CORRECTION ===== */
/*
  Satu sumber rumus untuk Monitoring Detail Lokasi.
  Kolom HARUS mengikuti urutan header:
  Lokasi | Stok Aset Lokasi | Stok Lokasi | Keluar | Masuk | Isi Ulang |
  Hutang | Lebih | Penambahan Aset | Biaya Isi Ulang |
  Biaya Penambahan Aset | Status
*/
function finalNum(v){
  var n=Number(v);
  return isFinite(n)?n:0;
}
function finalQty(arr){
  return (arr||[]).reduce(function(sum,x){return sum+finalNum(x&&x.qty)},0);
}
function finalByLokasi(arr,l){
  return tubeFilterArr(arr).filter(function(x){return sameLokasi(x&&x.lokasi,l)});
}
function finalQtyByKet(arr,l,matcher){
  return finalQty(finalByLokasi(arr,l).filter(function(x){return matcher(x&&x.keterangan)}));
}
function finalCostByKet(l,matcher){
  return finalByLokasi(data.keluar,l).filter(function(x){return matcher(x&&x.keterangan)}).reduce(function(sum,x){return sum+parseBiaya(x&&x.biaya)},0);
}

locStat=function(l){
  var keluarArr=finalByLokasi(data.keluar,l);
  var masukArr=finalByLokasi(data.kembali,l);
  var keluar=finalQty(keluarArr);
  var masuk=finalQty(masukArr);
  var isiUlang=finalQtyByKet(data.keluar,l,ketIsiUlang);
  var aset=finalQtyByKet(data.keluar,l,ketPenambahanAset);
  var mintaIsiUlang=finalQtyByKet(data.kembali,l,function(k){return normKet(k)==='minta isi ulang';});

  /*
     RUMUS MONITORING YANG BARU:
     - Stok Aset Lokasi adalah stok dasar/fisik lokasi.
       Nilainya hanya berubah dari Update Stok Aset dan Penambahan Aset.
     - Penambahan Aset langsung menambah Stok Aset Lokasi DAN Stok Lokasi.
     - Stok Lokasi dimulai dari Stok Aset Lokasi, lalu ditambah Tabung Keluar
       dan dikurangi Tabung Masuk. Jadi transaksi Masuk mengurangi stok lokasi.
     - Hutang tetap dihitung dari permintaan Minta Isi Ulang yang belum dipenuhi.
  */
  var manual=finalNum(getTubeAdjustment(l));
  var stokAset=manual+aset;

  // Stok lokasi dimulai dari stok aset lokasi, lalu bergerak mengikuti
  // Tabung Keluar (+) dan Tabung Masuk (-).
  var stokLokasi=stokAset+keluar-masuk;

  // Hutang/Lebih selalu dibandingkan terhadap stok aset lokasi yang sama.
  // Jika sama persis, keduanya wajib 0.
  var hutang=Math.max(0,stokAset-stokLokasi);
  var lebih=Math.max(0,stokLokasi-stokAset);

  return {
    keluar:keluar,
    masuk:masuk,
    stokLokasi:stokLokasi,
    isiUlang:isiUlang,
    hutang:hutang,
    lebih:lebih,
    aset:aset,
    mintaIsiUlang:mintaIsiUlang,
    stokAset:stokAset,
    biaya:finalCostByKet(l,ketIsiUlang),
    biayaAset:finalCostByKet(l,ketPenambahanAset),
    biayaKeluar:keluarArr.reduce(function(sum,x){return sum+parseBiaya(x&&x.biaya)},0)
  };

/* ===== ULTIMATE MONITORING FORMULA / SOURCE MAPPING FIX =====
   Source of truth:
   - Tabung Keluar  -> kolom Keluar (data.keluar)
   - Tabung Masuk   -> kolom Masuk  (data.kembali)
   - Isi Ulang      -> dihitung HANYA dari Tabung Keluar berketerangan "Isi Ulang"
   - Penambahan Aset-> dihitung HANYA dari Tabung Keluar berketerangan "Penambahan Aset"
   - Biaya Isi Ulang -> biaya Tabung Keluar berketerangan "Isi Ulang"
   - Biaya Penambahan Aset -> biaya Tabung Keluar berketerangan "Penambahan Aset"
   - Stok Aset Lokasi -> stok manual + Penambahan Aset
   - Stok Lokasi -> Stok Aset Lokasi + Keluar - Masuk
   - Hutang -> Minta Isi Ulang - Isi Ulang (minimum 0)
   - Lebih -> Stok Lokasi - Hutang (minimum 0)
   - Status -> berdasarkan Stok Lokasi - Hutang
*/
function ultimateRows(arr,l){
  return tubeFilterArr(arr).filter(function(x){return x && sameLokasi(x.lokasi,l);});
}
function ultimateQty(arr){
  return (arr||[]).reduce(function(sum,x){return sum+finalNum(x&&x.qty);},0);
}
function ultimateQtyKet(arr,l,matcher){
  return ultimateQty(ultimateRows(arr,l).filter(function(x){return matcher(x&&x.keterangan);}));
}
function ultimateCostKet(arr,l,matcher){
  /*
     BIAYA MONITORING = harga biaya per tabung x jumlah tabung.
     Jangan menjumlahkan harga satuan mentah.
     Contoh: qty 10 x biaya Rp350.000 = Rp3.500.000.
  */
  return ultimateRows(arr,l)
    .filter(function(x){return matcher(x&&x.keterangan);})
    .reduce(function(sum,x){
      var qty=finalNum(x&&x.qty);
      var biaya=parseBiaya(x&&x.biaya);
      return sum+(biaya*qty);
    },0);
}
function ultimateMintaIsiUlang(k){
  var n=normKet(k);
  return n==='minta isi ulang' || n==='minta isiulang' || n==='minta isi-ulang';
}

locStat=function(l){
  /* IMPORTANT: never mix the two source arrays. */
  var keluarRows=ultimateRows(data.keluar,l);
  var masukRows=ultimateRows(data.kembali,l);

  var keluar=ultimateQty(keluarRows); // ONLY Tabung Keluar
  var masuk=ultimateQty(masukRows);   // ONLY Tabung Masuk

  var isiUlang=ultimateQtyKet(data.keluar,l,ketIsiUlang); // ONLY Keluar + Isi Ulang
  var aset=ultimateQtyKet(data.keluar,l,ketPenambahanAset); // ONLY Keluar + Penambahan Aset
  var mintaIsiUlang=ultimateQtyKet(data.kembali,l,ultimateMintaIsiUlang); // ONLY Masuk + Minta Isi Ulang

  var stokManual=finalNum(getTubeAdjustment(l));
  // Stok aset adalah stok dasar/manual + penambahan aset.
  // Penambahan aset sudah menjadi bagian dari stok aset, jadi jangan dihitung
  // lagi sebagai pergerakan keluar agar tidak double-count.
  var stokAset=stokManual+aset;
  var keluarOperasional=keluarRows.filter(function(x){return !ketPenambahanAset(x&&x.keterangan);});
  var keluarNonAset=ultimateQty(keluarOperasional);

  // Stok lokasi = stok aset + tabung keluar non-aset - tabung masuk.
  // Karena penambahan aset sudah menaikkan stok aset, transaksi aset tidak
  // boleh ditambahkan kedua kalinya ke stok lokasi.
  var stokLokasi=stokAset+keluarNonAset-masuk;

  // Lebih/hutang hanya membandingkan saldo stok lokasi dengan stok aset lokasi.
  // Sama = 0/0 (sesuai), lokasi lebih banyak = Lebih, lokasi lebih sedikit =
  // Hutang ke lokasi.
  var hutang=Math.max(0,stokAset-stokLokasi);
  var lebih=Math.max(0,stokLokasi-stokAset);

  return {
    keluar:keluar,
    masuk:masuk,
    stokLokasi:stokLokasi,
    isiUlang:isiUlang,
    hutang:hutang,
    lebih:lebih,
    aset:aset,
    keluarOperasional:keluarNonAset,
    mintaIsiUlang:mintaIsiUlang,
    stokAset:stokAset,
    biaya:ultimateCostKet(data.keluar,l,ketIsiUlang),
    biayaAset:ultimateCostKet(data.keluar,l,ketPenambahanAset),
    biayaKeluar:keluarRows.reduce(function(sum,x){return sum+parseBiaya(x&&x.biaya);},0)
  };
};

/* ===== FILTER MONITORING DETAIL LOKASI: LOKASI + PERIODE ===== */
var monitoringFilter=window.monitoringFilter||{lokasi:'',from:'',to:''};
function dateKey(v){ var d=(typeof window.dashboardDateKey==='function'?window.dashboardDateKey(v):''); return d||String(v||'').slice(0,10); }
function inMonitoringPeriod(x){
  var d=dateKey(x&&x.tanggal);
  if(!d)return true;
  if(monitoringFilter.from && d<monitoringFilter.from)return false;
  if(monitoringFilter.to && d>monitoringFilter.to)return false;
  return true;
}
function selectedMonitoringLocations(){
  return monitoringFilter.lokasi ? locations.filter(function(l){return sameLokasi(l,monitoringFilter.lokasi);}) : locations.slice();
}
function statMonitoring(l){
  var from=monitoringFilter.from, to=monitoringFilter.to;
  function inPeriod(x){return inMonitoringPeriod(x);}
  var keluarAll=tubeFilterArr(data.keluar).filter(function(x){return sameLokasi(x.lokasi,l);});
  var masukAll=tubeFilterArr(data.kembali).filter(function(x){return sameLokasi(x.lokasi,l);});
  /* Pergerakan & biaya ditarik hanya pada periode yang dipilih. */
  var keluar=(from||to)?keluarAll.filter(inPeriod):keluarAll;
  var masuk=(from||to)?masukAll.filter(inPeriod):masukAll;
  /* Untuk saldo stok, gunakan posisi sampai tanggal akhir (snapshot), agar filter
     periode tidak membuat saldo stok seolah-olah dimulai dari nol. */
  var keluarSnapshot=to?keluarAll.filter(function(x){return dateKey(x.tanggal)<=to;}):keluarAll;
  var masukSnapshot=to?masukAll.filter(function(x){return dateKey(x.tanggal)<=to;}):masukAll;
  var minta=masuk.filter(function(x){return normKet(x.keterangan)==='minta isi ulang';}).reduce(function(s,x){return s+Number(x.qty||0)},0);
  var isi=keluar.filter(function(x){return ketIsiUlang(x.keterangan);}).reduce(function(s,x){return s+Number(x.qty||0)},0);
  var asetPeriod=keluar.filter(function(x){return ketPenambahanAset(x.keterangan);}).reduce(function(s,x){return s+Number(x.qty||0)},0);
  var asetSnapshot=keluarSnapshot.filter(function(x){return ketPenambahanAset(x.keterangan);}).reduce(function(s,x){return s+Number(x.qty||0)},0);
  var manual=Number(getTubeAdjustment(l)||0);
  var stokAset=manual+asetSnapshot;
  var stokLokasi=manual+keluarSnapshot.reduce(function(s,x){return s+Number(x.qty||0)},0)-masukSnapshot.reduce(function(s,x){return s+Number(x.qty||0)},0);
  var sel=stokLokasi-stokAset;

<script id="ktu-safe-crud-tubetype">
(function(){
  'use strict';
  function activeType(){
    return window.activeTubeType ||
      localStorage.getItem('KTU_ACTIVE_TUBE_TYPE') ||
      'LPG 12 Kg';
  }

  function ensureActions(){
    var page = window.activePage;
    if(page !== 'keluar' && page !== 'kembali') return;

    var table = document.querySelector('#content table');
    if(!table) return;

    var rows = table.querySelectorAll('tbody tr');
    if(!rows.length) rows = table.querySelectorAll('tr');

    var arr = page === 'keluar' ? window.data.keluar : window.data.kembali;
    var candidates = [];
    for(var i=0; i<(arr||[]).length; i++){
      if((arr[i].tubeType || 'LPG 12 Kg') === activeType()) candidates.push(i);
    }

    Array.prototype.forEach.call(rows, function(tr){
      var cells = tr.querySelectorAll('td');
      if(!cells.length) return;

      var last = cells[cells.length-1];
      if(!last || last.querySelector('button')) return;

      var no = Number((cells[0].textContent||'').trim());
      if(!no || !candidates[no-1]) return;

      var idx = candidates[no-1];
      if(typeof window.actionBtns === 'function'){
        last.innerHTML = window.actionBtns(page, idx);
      }else{
        last.innerHTML =
          '<button type="button" onclick="editRow(\''+page+'\','+idx+')">✏️ Edit</button> '+
          '<button type="button" onclick="deleteRow(\''+page+'\','+idx+')">🗑️ Hapus</button>';
      }
    });
  }

  function tagNew(type){
    try{
      var arr = window.data && window.data[type];
      if(Array.isArray(arr) && arr.length){
        var x = arr[arr.length-1];
        if(x && !x.tubeType){
          x.tubeType = activeType();
          if(typeof window.saveAll === 'function') window.saveAll();
        }
      }
    }catch(e){}
  }

  var originalShow = window.show;
  if(typeof originalShow === 'function'){
    window.show = function(page){
      var result = originalShow.apply(this, arguments);
      setTimeout(ensureActions, 0);
      return result;
    };
  }

  var originalAdd = window.addTrans;
  if(typeof originalAdd === 'function'){
    window.addTrans = function(type){
      var result = originalAdd.apply(this, arguments);
      setTimeout(function(){
        tagNew(type);
        ensureActions();
      }, 50);
      return result;
    };
  }

  setTimeout(ensureActions, 150);
  new MutationObserver(ensureActions).observe(document.body, {
    childList:true,
    subtree:true
  });
})();

<script id="ktu-search-global-v6">
(function(){
  'use strict';
  function norm(v){
    return String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  }
  function dist(a,b){
    if(a===b)return 0;
    if(!a)return b.length;
    if(!b)return a.length;
    var p=new Array(b.length+1),c=new Array(b.length+1),i,j;
    for(j=0;j<=b.length;j++)p[j]=j;
    for(i=1;i<=a.length;i++){
      c[0]=i;
      for(j=1;j<=b.length;j++) c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      var t=p;p=c;c=t;
    }
    return p[b.length];
  }
  function match(text,q){
    q=norm(q); if(!q)return true;
    text=norm(text); if(text.indexOf(q)!==-1)return true;
    var words=text.split(/\s+/).filter(Boolean);
    for(var i=0;i<words.length;i++){
      var w=words[i];
      if(w.indexOf(q)!==-1 || q.indexOf(w)!==-1)return true;
      var lim=q.length<=4?1:q.length<=7?2:3;
      if(Math.abs(w.length-q.length)<=lim && dist(w,q)<=lim)return true;
    }
    return false;
  }
  function bind(input){
    if(!input || input.__ktuSearchV6)return;
    input.__ktuSearchV6=true;
    input.setAttribute('autocomplete','off');
    input.placeholder='Cari data (lokasi / tanggal / jumlah / keterangan)...';
    function apply(){
      var root=document.getElementById('content')||document.body;
      var tables=root.querySelectorAll('table');
      var q=input.value||'';
      Array.prototype.forEach.call(tables,function(table){
        var trs=Array.prototype.slice.call(table.querySelectorAll('tr'));
        if(!trs.length)return;
        var visible=0, header=trs[0];
        trs.slice(1).forEach(function(tr){
          if(tr.classList.contains('ktu-total-row') || tr.classList.contains('ktu-no-result'))return;
          var hit=match(tr.textContent,q);
          tr.style.display=hit?'':'none';
          if(hit)visible++;
        });
        var old=table.querySelector('.ktu-no-result'); if(old)old.remove();
        if(norm(q) && visible===0){
          var nr=document.createElement('tr'); nr.className='ktu-no-result';
          var n=(header.children&&header.children.length)||6;
          nr.innerHTML='<td colspan="'+n+'" style="text-align:center;padding:16px;font-weight:700;color:#64748b">Data dengan kata <b>"'+String(q).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'"</b> tidak ditemukan.</td>';
          var total=table.querySelector('.ktu-total-row');
          if(total) table.insertBefore(nr,total); else table.appendChild(nr);
        }
      });
    }
    ['input','keyup','change','search'].forEach(function(ev){input.addEventListener(ev,apply,{passive:true});});
    input.oninput=apply;
    input.onkeyup=apply;
    input.onchange=apply;
    input.onsearch=apply;
    input.__ktuApplyV6=apply;
    apply();
  }
  function scan(){
    var root=document.getElementById('content')||document.body;
    Array.prototype.forEach.call(root.querySelectorAll('input[type="search"],input#qDev'),bind);
  }
  scan();
  new MutationObserver(function(){scan();}).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('pageshow',scan);
  window.ktuSearchGlobalV6=scan;
})();
</script>

<script id="ktu-tubetype-isolation-final">
(function(){
  'use strict';

  function currentType(){
    return localStorage.getItem('KTU_ACTIVE_TUBE_TYPE') ||
           window.activeTubeType ||
           'LPG 12 Kg';
  }

  function normalizeLegacyData(){
    try{
      if(!window.data)return;
      ['keluar','kembali'].forEach(function(k){
        if(!Array.isArray(window.data[k])) return;
        window.data[k].forEach(function(x){
          /* Data lama yang belum punya jenis tabung adalah data lama LPG 12 Kg. */
          if(x && !x.tubeType) x.tubeType='LPG 12 Kg';
        });
      });
      if(typeof window.saveAllDev==='function') window.saveAllDev();
    }catch(e){}
  }

  normalizeLegacyData();

  /*
   * Paksa selector menyimpan jenis tabung yang benar.
   * Tidak ada lagi fallback data transaksi 12 Kg ketika 3 Kg/5,5 Kg/50 Kg dipilih.
   */
  window.selectTubeType=function(type){
    var allowed=window.tubeTypes || ['LPG 12 Kg','LPG 3 Kg','LPG 5,5 Kg','LPG 50 Kg','Oxygen','Acetylene'];
    if(allowed.indexOf(type)<0) type='LPG 12 Kg';

    window.activeTubeType=type;
    try{ localStorage.setItem('KTU_ACTIVE_TUBE_TYPE',type); }catch(e){}

    var sub=document.getElementById('brandSubtitle');
    if(sub) sub.textContent='Logistik '+type;

    if(typeof window.buildNav==='function') window.buildNav();

    var f=document.getElementById('tubeTypeFilter');
    if(f) f.value=type;

    /* Render ulang halaman yang sedang aktif dengan jenis yang baru. */
    var page=window.activePage || localStorage.getItem('KTU_ACTIVE_PAGE') || 'dashboard';
    if(typeof window.show==='function') window.show(page);
  };

  /*
   * Filter transaksi berdasarkan jenis tabung secara TEGAS.
   * Tidak memakai "|| LPG 12 Kg" saat membaca transaksi.
   */
  window.tubeRows=function(type){
    var a=(window.data && window.data[type]) || [];
    var active=currentType();
    return a.map(function(x,i){return {x:x,i:i};}).filter(function(o){
      return o.x && String(o.x.tubeType||'')===String(active);
    });
  };

  /*
   * Jaga supaya renderer transaksi selalu membaca selector terbaru.
   * Fungsi filtered asli tetap dipakai untuk tanggal/lokasi.
   */
  window.getActiveTubeType=function(){return currentType();};

  /* Bila pengguna berpindah jenis saat berada di Tabung Keluar/Masuk,
     langsung render ulang tanpa membawa filter/rows jenis sebelumnya. */
  document.addEventListener('change',function(e){
    if(e.target && e.target.id==='tubeTypeFilter'){
      window.selectTubeType(e.target.value);
    }
  });

  /* Pastikan judul transaksi mengikuti jenis yang dipilih. */
  var oldShow=window.show;
  window.show=function(page){
    var r=oldShow.apply(this,arguments);
    if(page==='keluar'||page==='kembali'){
      setTimeout(function(){
        var h=document.querySelector('#content .section-head h3');
        if(h) h.textContent=(page==='keluar'?'Tabung Keluar':'Tabung Masuk')+' — '+currentType();
      },0);
    }
    return r;
  };
})();
</script>


<script id="ktu-all-tubetype-isolation-v2">
(function(){
  'use strict';

  function activeType(){
    return window.activeTubeType ||
      localStorage.getItem('KTU_ACTIVE_TUBE_TYPE') ||
      'LPG 12 Kg';
  }

  function isActive(x){
    return x && String(x.tubeType||'')===String(activeType());
  }

  /* Perbaiki semua data transaksi lama yang belum punya tubeType.
     Hanya transaksi lama tanpa tubeType yang dianggap 12 Kg. */
  function migrate(){
    if(!window.data)return;
    ['keluar','kembali'].forEach(function(k){
      (window.data[k]||[]).forEach(function(x){
        if(x && !x.tubeType) x.tubeType='LPG 12 Kg';
      });
    });
    if(typeof window.saveAllDev==='function') window.saveAllDev();
    else if(typeof window.saveAll==='function') window.saveAll();
  }

  migrate();

  /* Filter transaksi secara ketat untuk SEMUA jenis tabung. */
  window.tubeFilterArr=function(arr){
    return (arr||[]).filter(isActive);
  };

  window.tubeFilter=function(arr){
    return (arr||[]).filter(isActive);
  };

  /*
   * Patch renderer transaksi yang paling akhir.
   * Kita panggil renderer asli, lalu bersihkan baris yang bukan jenis aktif.
   * Ini mencegah 5,5/50/Oxygen/Acetylene mewarisi baris 12 Kg.
   */
  function cleanTransactionTable(){
    var page=window.activePage;
    if(page!=='keluar' && page!=='kembali') return;
    var table=document.querySelector('#content table');
    if(!table)return;

    var source=(window.data && window.data[page])||[];
    var allowed=[];
    source.forEach(function(x,i){
      if(isActive(x)) allowed.push(i);
    });

    var body=table.tBodies && table.tBodies[0];
    if(!body)return;

    var rows=Array.prototype.slice.call(body.rows);
    rows.forEach(function(tr, visualIndex){
      /* Jika nomor urut tersedia, cocokkan ke data aktif. */
      var first=tr.cells && tr.cells[0];
      var n=first ? parseInt((first.textContent||'').trim(),10) : NaN;
      if(!isNaN(n) && allowed[n-1]!==undefined) return;

      /* Jangan menghapus baris kosong/total/footer. */
      var txt=(tr.textContent||'').trim();
      if(!txt)return;

      /* Baris data yang berisi tanggal biasanya punya input tanggal format yyyy-mm-dd. */
      if(/^\d{4}-\d{2}-\d{2}$/.test(txt.slice(0,10)) || tr.querySelector('button.ktu-edit,button.ktu-delete')){
        tr.remove();
      }
    });
  }

  /* Pastikan saat memilih jenis apa pun, halaman transaksi dirender ulang. */
  var oldShow=window.show;
  window.show=function(page){
    var result=oldShow.apply(this,arguments);
    if(page==='keluar'||page==='kembali'){
      setTimeout(cleanTransactionTable,0);
      setTimeout(cleanTransactionTable,80);
    }
    return result;
  };

  /* Jika selector jenis tabung berubah, bersihkan transaksi lama segera. */
  document.addEventListener('change',function(e){
    if(e.target && (e.target.id==='tubeTypeFilter' || e.target.name==='tubeType')){
      setTimeout(function(){
        if(window.activePage==='keluar'||window.activePage==='kembali'){
          cleanTransactionTable();
        }
      },50);
    }
  });
})();
</script>


<script id="ktu-strict-type-filter-final">

<script id="ktu-monitoring-asset-final-v4">
(function(){
  'use strict';

  function activeTypeV4(){
    var el=document.getElementById('tubeTypeFilter');
    var t=el && el.value ? el.value : (window.activeTubeType || localStorage.getItem('KTU_ACTIVE_TUBE_TYPE') || 'LPG 12 Kg');
    return String(t).trim() || 'LPG 12 Kg';
  }

  function normTypeV4(v){
    var s=String(v==null?'':v).trim().toLowerCase();
    var map={
      'lpg 12 kg':'LPG 12 Kg','lpg 12kg':'LPG 12 Kg','12 kg':'LPG 12 Kg','12kg':'LPG 12 Kg',
      'lpg 3 kg':'LPG 3 Kg','lpg 3kg':'LPG 3 Kg','3 kg':'LPG 3 Kg','3kg':'LPG 3 Kg',
      'lpg 5,5 kg':'LPG 5,5 Kg','lpg 5.5 kg':'LPG 5,5 Kg','lpg 5,5kg':'LPG 5,5 Kg','5,5 kg':'LPG 5,5 Kg',
      'lpg 50 kg':'LPG 50 Kg','lpg 50kg':'LPG 50 Kg','50 kg':'LPG 50 Kg','50kg':'LPG 50 Kg',
      'oxygen':'Oxygen','oksigen':'Oxygen',
      'acetylene':'Acetylene','acetilen':'Acetylene','acetylene gas':'Acetylene'
    };
    return map[s] || String(v==null?'':v).trim();
  }

  function recordTypeV4(x){
    if(!x) return '';
    var candidates=[x.tubeType,x.jenisTabung,x.jenis,x.type,x.tube,x.tipeTabung];
    for(var i=0;i<candidates.length;i++){
      if(candidates[i]!==undefined && String(candidates[i]).trim()!=='') return normTypeV4(candidates[i]);
    }
    return 'LPG 12 Kg';
  }

  function rowsV4(arr){
    var active=normTypeV4(activeTypeV4());
    return (arr||[]).filter(function(x){return x && recordTypeV4(x)===active;});
  }

  function qtyV4(arr){
    return (arr||[]).reduce(function(s,x){return s+Number(x&&x.qty||0);},0);
  }

  function ketV4(v){
    return String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');
  }
  function isIsiV4(v){return ketV4(v)==='isi ulang';}
  function isAsetV4(v){return ketV4(v)==='penambahan aset';}
  function isMintaV4(v){return ['minta isi ulang','minta isiulang','minta isi-ulang'].indexOf(ketV4(v))>=0;}
  function sameLocV4(a,b){
    if(typeof window.sameLokasi==='function') return window.sameLokasi(a,b);
    return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
  }
  function biayaV4(x){
    if(typeof window.parseBiaya==='function') return Number(window.parseBiaya(x&&x.biaya)||0);
    return Number(x&&x.biaya||0);
  }
  function moneyV4(v){
    return typeof window.money==='function' ? window.money(v) : ('Rp '+Number(v||0).toLocaleString('id-ID'));
  }
  function escV4(v){
    return typeof window.esc==='function' ? window.esc(v) : String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }

  /* Satu rumus monitoring yang tidak tergantung renderer lama. */
  window.locStat=function(l){
    /*
       PERBAIKAN PERIODE DASHBOARD:
       Jika Dashboard sedang memakai monitoringFilter.dari/sampai,
       seluruh transaksi yang dihitung HARUS berada di periode tersebut.
       Ini mencegah transaksi September muncul saat Dashboard April/Mei.
       Pada halaman Monitoring biasa, filter tetap bekerja seperti sebelumnya.
    */
    function inActivePeriodV4(x){
      var d=typeof window.dashboardDateKey==='function' ? window.dashboardDateKey(x&&x.tanggal) : String(x&&x.tanggal||'');
      if(!d)return false;
      // Saat Dashboard dirender, gunakan periode Dashboard yang aktif.
      // monitoringFilter berada di IIFE lain sehingga tidak bisa dibaca langsung.
      var dp=window.__ktuDashboardPeriod;
      if(dp){
        if(dp.start && d<dp.start)return false;
        if(dp.end && d>dp.end)return false;
        return true;
      }
      var mf=window.monitoringFilter||{};
      if(mf.dari && d<mf.dari)return false;
      if(mf.sampai && d>mf.sampai)return false;
      return true;
    }
    var keluar=rowsV4(window.data&&window.data.keluar).filter(function(x){return sameLocV4(x.lokasi,l)&&inActivePeriodV4(x);});
    var masuk=rowsV4(window.data&&window.data.kembali).filter(function(x){return sameLocV4(x.lokasi,l)&&inActivePeriodV4(x);});
    var isi=keluar.filter(function(x){return isIsiV4(x.keterangan);});
    var aset=keluar.filter(function(x){return isAsetV4(x.keterangan);});
    var minta=masuk.filter(function(x){return isMintaV4(x.keterangan);});

    var keluarQty=qtyV4(keluar);
    var masukQty=qtyV4(masuk);
    var isiQty=qtyV4(isi);
    var asetQty=qtyV4(aset);
    var mintaQty=qtyV4(minta);

    var adjustment=0;
    try{
      var adj=(window.data&&window.data.stokAsetAdjustment)||{};
      var key=activeTypeV4()+'||'+String(l||'');
      if(Object.prototype.hasOwnProperty.call(adj,key)) adjustment=Number(adj[key]||0);
      else if(activeTypeV4()==='LPG 12 Kg' && Object.prototype.hasOwnProperty.call(adj,l)) adjustment=Number(adj[l]||0);
    }catch(e){}

    var stokAset=adjustment+asetQty;
    var keluarNonAset=keluar.filter(function(x){return !isAsetV4(x.keterangan);});
    var stokLokasi=stokAset+qtyV4(keluarNonAset)-masukQty;
    var hutang=Math.max(0,stokAset-stokLokasi);
    var lebih=Math.max(0,stokLokasi-stokAset);

    var biayaIsi=isi.reduce(function(s,x){return s+biayaV4(x)*Number(x.qty||0);},0);
    var biayaAset=aset.reduce(function(s,x){return s+biayaV4(x)*Number(x.qty||0);},0);

    return {
      keluar:keluarQty,masuk:masukQty,isiUlang:isiQty,aset:asetQty,
      mintaIsiUlang:mintaQty,stokAset:stokAset,stokLokasi:stokLokasi,
      hutang:hutang,lebih:lebih,biaya:biayaIsi,biayaAset:biayaAset,
      keluarRows:keluar,masukRows:masuk
    };
  };

  function statusV4(s){
    if(typeof window.statusLokasi==='function') return window.statusLokasi(s);
    var d=Number(s.stokLokasi||0)-Number(s.stokAset||0);
    return d===0?'Sesuai':(d>0?'Lebih':'Hutang');
  }

  function renderMonitoringAsetV4(selected){
    var c=document.getElementById('content'); if(!c)return;
    var type=activeTypeV4();
    var locs=window.locations||[];
    var rows=locs.map(function(l){
      var s=window.locStat(l);
      var outline=selected && sameLocV4(selected,l)?' style="outline:2px solid #d90429;outline-offset:-2px"':'';
      return '<tr'+outline+'>'+
        '<td><b>'+escV4(l)+'</b></td>'+
        '<td>'+s.keluar+'</td><td>'+s.masuk+'</td><td>'+s.isiUlang+'</td>'+
        '<td>'+s.hutang+'</td><td>'+s.lebih+'</td><td>'+s.aset+'</td>'+
        '<td><b>'+s.stokLokasi+'</b></td><td>'+moneyV4(s.biaya)+'</td><td>'+moneyV4(s.biayaAset)+'</td><td>'+statusV4(s)+'</td></tr>';
    }).join('');

    var detailLocs=selected?[selected]:locs;
    var detail='';
    detailLocs.forEach(function(l){
      var k=rowsV4(window.data&&window.data.keluar).filter(function(x){return sameLocV4(x.lokasi,l);});
      var m=rowsV4(window.data&&window.data.kembali).filter(function(x){return sameLocV4(x.lokasi,l);});
      var r=rowsV4(window.data&&window.data.refill).filter(function(x){return sameLocV4(x.lokasi,l);});
      var a=rowsV4(window.data&&window.data.aset).filter(function(x){return sameLocV4(x.lokasi,l);});
      var s=window.locStat(l);

      var all=[];
      k.forEach(function(x){all.push('<tr><td>Tabung Keluar</td><td>'+escV4(x.tanggal||'')+'</td><td>'+escV4(x.lokasi||'')+'</td><td>'+Number(x.qty||0)+'</td><td>'+escV4(x.keterangan||'')+'</td><td>'+moneyV4(biayaV4(x)*Number(x.qty||0))+'</td></tr>');});
      m.forEach(function(x){all.push('<tr><td>Tabung Masuk</td><td>'+escV4(x.tanggal||'')+'</td><td>'+escV4(x.lokasi||'')+'</td><td>'+Number(x.qty||0)+'</td><td>'+escV4(x.keterangan||'')+'</td><td>'+moneyV4(0)+'</td></tr>');});
      r.forEach(function(x){var q=Number(x.qty||0),bc=Number(x.biaya||0),tt=Number(x.total||0)||q*bc;all.push('<tr><td>Isi Ulang</td><td>'+escV4(x.tanggal||'')+'</td><td>'+escV4(x.lokasi||'')+'</td><td>'+q+'</td><td>'+escV4(x.supplier||x.keterangan||'')+'</td><td>'+moneyV4(tt)+'</td></tr>');});
      a.forEach(function(x){all.push('<tr><td>Penambahan Aset</td><td>'+escV4(x.tanggal||'')+'</td><td>'+escV4(x.lokasi||'')+'</td><td>'+Number(x.qty||0)+'</td><td>Harga tabung + isi awal</td><td>'+moneyV4(x.total||0)+'</td></tr>');});

      detail+='<div class="panel"><div class="section-head"><div><h3>Detail Transaksi Aset - '+escV4(l)+'</h3><p class="muted">Jenis tabung aktif: <b>'+escV4(type)+'</b>. Ditemukan <b>'+all.length+'</b> transaksi untuk lokasi ini.</p></div></div>'+
        '<div class="cards"><div class="card"><div class="label">Stok Lokasi</div><div class="value">'+s.stokLokasi+'</div></div><div class="card"><div class="label">Keluar</div><div class="value">'+s.keluar+'</div></div><div class="card"><div class="label">Masuk</div><div class="value">'+s.masuk+'</div></div><div class="card"><div class="label">Biaya Isi Ulang</div><div class="value">'+moneyV4(s.biaya)+'</div></div></div>'+
        '<div class="table"><table><tr><th>Jenis</th><th>Tanggal</th><th>Lokasi</th><th>Jumlah</th><th>Keterangan / Supplier</th><th>Total Biaya</th></tr>'+
        (all.join('')||'<tr><td colspan="6">Belum ada transaksi untuk jenis tabung ini.</td></tr>')+
        '</table></div></div>';
    });

    c.innerHTML='<div class="panel"><div class="section-head"><div><h3>Monitoring Detail Aset</h3><p class="muted">Jenis tabung aktif: <b>'+escV4(type)+'</b>. Rumus mengambil transaksi berdasarkan jenis tabung yang sama.</p></div><button type="button" class="primary" style="width:auto" onclick="show(\'lokasi\')">Kembali ke Monitoring Lokasi</button></div>'+
      '<div class="tools" style="margin-bottom:12px"><button type="button" id="btnMonitoringAsetPDFV4">Export PDF</button><button type="button" onclick="window.repairTubeTypes()">🛠️ Perbaiki Jenis Data Lama</button></div>'+
      '<div class="panel" style="padding:12px;background:#f8fafc"><b>Jenis:</b> '+escV4(type)+' &nbsp; | &nbsp; <b>Transaksi Keluar:</b> '+rowsV4(window.data&&window.data.keluar).length+' &nbsp; | &nbsp; <b>Transaksi Masuk:</b> '+rowsV4(window.data&&window.data.kembali).length+'</div>'+
      '<div class="table"><table><tr><th>Lokasi</th><th>Keluar</th><th>Masuk</th><th>Isi Ulang</th><th>Hutang</th><th>Lebih</th><th>Penambahan Aset</th><th>Stok Lokasi</th><th>Biaya Isi Ulang</th><th>Biaya Penambahan Aset</th><th>Status</th></tr>'+rows+'</table></div></div>'+detail;

    var b=document.getElementById('btnMonitoringAsetPDFV4');
    if(b)b.onclick=function(){exportMonitoringAsetPDFV4(selected);};
  }

  function exportMonitoringAsetPDFV4(selected){
    var type=activeTypeV4(), locs=selected?[selected]:(window.locations||[]), out=[];
    locs.forEach(function(l){
      rowsV4(window.data&&window.data.keluar).filter(function(x){return sameLocV4(x.lokasi,l);}).forEach(function(x){
        out.push(['Tabung Keluar',x.tanggal||'',l,Number(x.qty||0),x.keterangan||'',moneyV4(biayaV4(x)*Number(x.qty||0))]);
      });
      rowsV4(window.data&&window.data.kembali).filter(function(x){return sameLocV4(x.lokasi,l);}).forEach(function(x){
        out.push(['Tabung Masuk',x.tanggal||'',l,Number(x.qty||0),x.keterangan||'',moneyV4(0)]);
      });
      rowsV4(window.data&&window.data.refill).filter(function(x){return sameLocV4(x.lokasi,l);}).forEach(function(x){
        var q=Number(x.qty||0),bc=Number(x.biaya||0),tt=Number(x.total||0)||q*bc;
        out.push(['Isi Ulang',x.tanggal||'',l,q,x.supplier||x.keterangan||'',moneyV4(tt)]);
      });
      rowsV4(window.data&&window.data.aset).filter(function(x){return sameLocV4(x.lokasi,l);}).forEach(function(x){
        out.push(['Penambahan Aset',x.tanggal||'',l,Number(x.qty||0),'Harga tabung + isi awal',moneyV4(x.total||0)]);
      });
    });
    var w=window.open('','_blank','width=1200,height=850');
    if(!w){alert('Jendela cetak diblokir browser. Izinkan pop-up untuk Export PDF.');return;}
    var body=out.length?out.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+escV4(c)+'</td>';}).join('')+'</tr>';}).join(''):'<tr><td colspan="6">Tidak ada transaksi untuk jenis tabung ini.</td></tr>';
    var css='*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:24px;color:#111;font-size:11px}h1{font-size:22px;margin:0 0 5px}.meta{color:#555;margin-bottom:14px;border-bottom:2px solid #111;padding-bottom:10px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #999;padding:7px;text-align:left}th{background:#eee}@page{size:A4 landscape;margin:10mm}';
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Monitoring Detail Aset - '+escV4(type)+'</title><style>'+css+'</style></head><body>');
    w.document.write('<h1>PT KTU - Logistik LPG 12 Kg</h1><div class="meta"><b>Monitoring Detail Aset</b> | Jenis Tabung: <b>'+escV4(type)+'</b> | '+(selected?'Lokasi: <b>'+escV4(selected)+'</b> | ':'')+'Dicetak: '+new Date().toLocaleString('id-ID')+'</div>');
    w.document.write('<table><thead><tr><th>Jenis</th><th>Tanggal</th><th>Lokasi</th><th>Jumlah</th><th>Keterangan / Supplier</th><th>Total Biaya</th></tr></thead><tbody>'+body+'</tbody></table>');
    w.document.write('<script>window.onload=function(){setTimeout(function(){window.focus();window.print();},300)}<\/script></body></html>');
    w.document.close();
  }

  window.exportMonitoringAsetPDF=exportMonitoringAsetPDFV4;
  window.monitoringAset=renderMonitoringAsetV4;

  /* Bila selector berubah, langsung refresh monitoring yang sedang dibuka. */
  document.addEventListener('change',function(e){
    if(e.target && e.target.id==='tubeTypeFilter'){
      window.activeTubeType=e.target.value;
      try{localStorage.setItem('KTU_ACTIVE_TUBE_TYPE',e.target.value);}catch(err){}
      if(window.activePage==='monitoringAset') setTimeout(function(){renderMonitoringAsetV4('');},0);
    }
  },true);

})();
</script>
